</style></head><body><aside><div class="brand"><div class="logo">◒</div><div><b>la taquería<span style="color:#e87936">.</span></b><small>VENTAS & CAJA</small></div></div><div class="navlabel">TU NEGOCIO</div><nav id="nav"></nav><div class="sidebar-bottom"><div class="live" id="live"></div><div class="person"><div class="avatar">AD</div><div>Administrador<small>Cuenta de demostración</small></div></div></div></aside><main><header><div class="crumb">Mi taquería <span style="margin:0 12px;color:#c5ccc3">/</span><b id="crumb">Resumen</b></div><div class="pill"><span class="dot" style="background:#dcab68;width:5px;height:5px"></span> DEMO INTERACTIVA</div></header><div id="app" class="content"></div></main><div id="sale-announcement" class="sr-only" aria-live="polite" aria-atomic="true"></div><div id="modal"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const icons={dashboard:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',sale:'<path d="M3 7h18l-2 9H6L3 3H1"/><circle cx="8" cy="21" r="1"/><circle cx="18" cy="21" r="1"/>',history:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/>',cash:'<rect x="2" y="6" width="20" height="14" rx="2"/><path d="M7 6V3h10v3M2 11h20M9 15h6"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M7 17L17 7M7 7h10v10"/>',money:'<rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="12" cy="12" r="3"/>',ticket:'<path d="M5 3h14v18l-3-2-4 2-4-2-3 2zM9 7h6M9 11h6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 11h18"/>',export:'<path d="M12 3v12M8 11l4 4 4-4M4 15v6h16v-6"/>'};const icon=k=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[k]||icons.money}</svg>`;
const money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:2}).format(n);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const day=d=>new Date(d).toLocaleDateString('en-CA',{timeZone:'America/Hermosillo'});const today=()=>day(new Date());const time=d=>new Date(d).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',timeZone:'America/Hermosillo'});
const menu=[{id:1,name:'Taco de asada',desc:'El favorito de la casa',price:35,cat:'Tacos',emoji:'🌮'},{id:2,name:'Taco al pastor',desc:'Con piña y mucho sabor',price:30,cat:'Tacos',emoji:'🌮'},{id:3,name:'Taco de cabeza',desc:'Suave, jugoso y tradicional',price:32,cat:'Tacos',emoji:'🌮'},{id:4,name:'Taco de tripa',desc:'Doradita al punto',price:38,cat:'Tacos',emoji:'🌮'},{id:5,name:'Quesadilla de asada',desc:'Tortilla de harina y queso',price:65,cat:'Especialidades',emoji:'🫓'},{id:6,name:'Vampiro de asada',desc:'Tostada crujiente con queso',price:55,cat:'Especialidades',emoji:'🧀'},{id:7,name:'Agua fresca',desc:'Vaso de 500 ml',price:25,cat:'Bebidas',emoji:'🥤'},{id:8,name:'Refresco',desc:'Botella de 600 ml',price:30,cat:'Bebidas',emoji:'🍾'},{id:9,name:'Queso extra',desc:'Una porción adicional',price:15,cat:'Extras',emoji:'🧀'}];
function seed(){let sales=[],n=1;for(let days=6;days>=0;days--){for(let j=0;j<(days===0?24:12+days*3);j++){let d=new Date();d.setDate(d.getDate()-days);d.setHours(15+Math.floor(j/4),j%4*14,0,0);if(days===0){d=new Date(Date.now()-(24-j)*17*60000)}let a=menu[(j+days)%6],b=menu[6+j%2],items=[{...a,qty:2+j%4},{...b,qty:1+j%2}],total=items.reduce((s,i)=>s+i.qty*i.price,0);sales.push({id:n++,date:d.toISOString(),items,total,method:['Efectivo','Efectivo','Tarjeta','Transferencia'][j%4],type:j%3?'Mesa':'Para llevar',table:j%3?String(j%8+1):'',note:'',session:days===0?'initial':'past-'+days});}}return {sales,moves:[],session:{id:'initial',opened:sales.find(s=>s.session==='initial').date,fund:500,closed:false},cuts:[]};}
let db;try{db=JSON.parse(localStorage.getItem('taqueria-demo-v1'))}catch(e){}if(!db||!db.sales)db=seed();let view='sale',range='today',category='Todos',query='',cart=[],orderType='Mesa',table='1',orderNote='',payMethod='Efectivo',historyQuery='',historyMethod='Todos';const save=()=>localStorage.setItem('taqueria-demo-v1',JSON.stringify(db));const totalCart=()=>cart.reduce((s,i)=>s+i.qty*i.price,0);const currentSales=()=>db.sales.filter(s=>s.session===db.session.id&&!s.cancelled);const currentMoves=()=>db.moves.filter(m=>m.session===db.session.id);const expected=()=>db.session.fund+currentSales().filter(s=>s.method==='Efectivo').reduce((a,s)=>a+s.total,0)+currentMoves().reduce((a,m)=>a+(m.type==='Entrada'?m.amount:-m.amount),0);function selected(){let now=today();return db.sales.filter(s=>!s.cancelled&&(range==='today'?day(s.date)===now:new Date(s.date)>=new Date(Date.now()-7*864e5)))}
function toast(msg){document.getElementById('toast').textContent=msg;document.getElementById('toast').classList.remove('hidden');setTimeout(()=>document.getElementById('toast').classList.add('hidden'),3500)}
function go(v){view=v;render();window.scrollTo(0,0)}function render(){document.getElementById('nav').innerHTML=[['dashboard','Resumen'],['sale','Nueva venta'],['history','Historial de ventas'],['cash','Corte de caja']].map(([id,name])=>`<button aria-label="${name}" title="${name}" onclick="go('${id}')" class="${view===id?'active':''}">${icon(id)}<span>${name}</span></button>`).join('');document.getElementById('crumb').textContent={dashboard:'Resumen',sale:'Nueva venta',history:'Historial de ventas',cash:'Corte de caja'}[view];document.getElementById('live').innerHTML=`<span class="dot" style="${db.session.closed?'background:#d7a66c':''}"></span>${db.session.closed?'Caja cerrada':'Caja abierta'}<div style="color:#879b8c;margin:8px 0 0 14px;font-size:10px">${db.session.closed?'Inicia un nuevo turno':'Todo listo para vender'}</div>`;document.getElementById('app').innerHTML=({dashboard:dashboard,sale:pos,history:history,cash:cash})[view]()}
const heading=(title,subtitle,action='')=>`<div class="heading"><div><h1>${title}</h1><p>${subtitle}</p></div>${action}</div>`;
function rows(sales,details=true){return sales.length?sales.map(s=>`<tr class="${s.cancelled?'cancelled':''}"><td><b>#${String(s.id).padStart(4,'0')}</b><div style="font-size:10px;color:#929b93;margin-top:4px">${time(s.date)}</div></td><td>${s.type==='Mesa'?'Mesa '+esc(s.table):'Para llevar'}</td><td><span class="badge ${s.method.toLowerCase()}">${s.method}</span></td><td><b>${money(s.total)}</b></td>${details?`<td><button class="link" onclick="receipt(${s.id})">Ver ticket</button></td>`:''}</tr>`).join(''):'<tr><td colspan="5" class="empty">Todavía no hay ventas en este periodo.</td></tr>'}
function dashboard(){let ss=selected(),total=ss.reduce((a,s)=>a+s.total,0),qty=ss.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.qty,0),0),methods=['Efectivo','Tarjeta','Transferencia'].map(m=>ss.filter(s=>s.method===m).reduce((a,s)=>a+s.total,0));let hourStart=Math.max(0,Number(new Date().toLocaleString('en-US',{hour:'numeric',hour12:false,timeZone:'America/Hermosillo'}))-7);let bins=Array(8).fill(0),labels=range==='today'?Array.from({length:8},(_,i)=>(hourStart+i)+' h'):Array.from({length:7},(_,i)=>{let d=new Date(Date.now()-(6-i)*864e5);return d.toLocaleDateString('es-MX',{weekday:'short',timeZone:'America/Hermosillo'})});if(range==='week')bins=Array(7).fill(0);ss.forEach(s=>{let i=range==='today'?Math.max(0,Math.min(7,Number(new Date(s.date).toLocaleString('en-US',{hour:'numeric',hour12:false,timeZone:'America/Hermosillo'}))-hourStart)):labels.length-1-Math.round((new Date(today()+'T12:00:00')-new Date(day(s.date)+'T12:00:00'))/864e5);if(i>=0&&i<bins.length)bins[i]+=s.total});let max=Math.max(100,...bins),ranks={};ss.forEach(s=>s.items.forEach(i=>{ranks[i.name]=(ranks[i.name]||0)+i.qty}));let ranked=Object.entries(ranks).sort((a,b)=>b[1]-a[1]).slice(0,4),a=total?methods[0]/total*100:0,b=total?methods[1]/total*100:0;
return heading('Así va tu taquería','Tus números claros, para tomar mejores decisiones.',`<button class="btn primary" onclick="go('sale')">${icon('plus')} Nueva venta</button>`)+`<div class="toolbar"><div class="tabs"><button class="${range==='today'?'active':''}" onclick="range='today';render()">Hoy</button><button class="${range==='week'?'active':''}" onclick="range='week';render()">Últimos 7 días</button></div><div class="date">${icon('calendar')}${new Date().toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric',timeZone:'America/Hermosillo'})}</div></div><div class="grid4">${[['Ventas totales',money(total),'money','Dinero vendido en el periodo'],['Pedidos registrados',ss.length,'ticket','Todas las formas de pago'],['Ticket promedio',money(ss.length?total/ss.length:0),'arrow','Lo que gasta cada pedido'],['Efectivo en caja',money(expected()),'cash','Fondo + ventas + movimientos']].map(([t,v,i,s])=>`<div class="card"><div class="stat-top">${t}<div class="stat-icon">${icon(i)}</div></div><div class="stat-value">${v}</div><div class="sub">${i==='cash'?'Turno actual · ':''}${s}</div></div>`).join('')}</div><div class="charts"><section class="card"><div class="cardhead"><div><h2>Ventas ${range==='today'?'por hora':'de la semana'}</h2><p>Identifica los momentos con más movimiento</p></div><span class="badge">${qty} productos</span></div><div class="chart" role="img" aria-label="Gráfica de ventas ${bins.map((v,i)=>labels[i]+': '+money(v)).join(', ')}"><div class="yaxis">${[1,.75,.5,.25,0].map(v=>`<span>${money(max*v).replace('.00','')}</span>`).join('')}</div><div class="bars">${bins.map((v,i)=>`<div class="barcol" title="${labels[i]}: ${money(v)}"><div class="bar" style="height:${v/max*94}%"></div><span>${labels[i]}</span></div>`).join('')}</div></div></section><section class="card"><div><h2>¿Cómo te pagan?</h2><p style="font-size:11px">Distribución de tus ventas</p></div><div class="donut-wrap"><div class="donut" style="background:conic-gradient(#3b7352 0 ${a}%,#e79a60 ${a}% ${a+b}%,#c1cdb4 ${a+b}% 100%)"><div><small>Total vendido</small><b>${money(total).replace('.00','')}</b></div></div><div class="legend">${methods.map((v,i)=>`<div><div class="legend-row"><span><i class="swatch" style="background:${['#3b7352','#e79a60','#c1cdb4'][i]}"></i>${['Efectivo','Tarjeta','Transferencia'][i]}</span><b>${total?Math.round(v/total*100):0}%</b></div><div style="margin:5px 0 0 15px;font-size:10px;color:#8d978c">${money(v)}</div></div>`).join('')}</div></div><div class="note">Solo el efectivo forma parte del dinero físico en caja.</div></section></div><div class="bottomgrid"><section class="card"><div class="cardhead" style="margin-bottom:5px"><div><h2>Últimas ventas</h2><p>Cada pedido, en un solo lugar</p></div><button class="link" onclick="go('history')">Ver todas ↗</button></div><div class="tablewrap"><table><thead><tr><th>Pedido</th><th>Servicio</th><th>Pago</th><th>Total</th><th></th></tr></thead><tbody>${rows([...ss].reverse().slice(0,4))}</tbody></table></div></section><section class="card"><h2>Los favoritos</h2><p style="font-size:11px">Productos más vendidos del periodo</p>${ranked.length?ranked.map(([name,n],i)=>`<div class="product-rank"><div class="rankline"><span><small style="margin-right:8px">0${i+1}</small>${name}</span><small>${n} vendidos</small></div><div class="rankbar"><div style="width:${n/ranked[0][1]*100}%"></div></div></div>`).join(''):'<div class="empty">Registra tu primera venta.</div>'}</section></div><div class="footer"><span>◉ Datos de demostración · Tus cambios se guardan en este navegador</span><span>Hecho para que te concentres en tus tacos.</span></div>`}
function pos(){let filtered=menu.filter(p=>(category==='Todos'||p.cat===category)&&p.name.toLowerCase().includes(query.toLowerCase())),units=cart.reduce((n,i)=>n+i.qty,0);return `<div class="selling">${heading('¿Qué vamos a servir?','Toca un producto para agregarlo al pedido.',`<button class="btn" onclick="go('dashboard')">${icon('dashboard')} Ver mis ventas</button>`)}${db.session.closed?`<div class="closed-banner"><span>La caja está cerrada. Abre un turno para registrar ventas.</span><button class="btn primary" onclick="openForm()">Abrir caja</button></div>`:''}<div class="pos"><section class="menu-panel"><div class="menu-tools"><input class="search" placeholder="Buscar en el menú…" aria-label="Buscar productos" value="${esc(query)}" oninput="query=this.value;updateProducts()"><div class="categories">${['Todos','Tacos','Especialidades','Bebidas','Extras'].map(c=>`<button class="${category===c?'active':''}" onclick="category='${c}';render()">${c}</button>`).join('')}</div></div><div class="products" id="products">${productCards(filtered)}</div><div class="menu-tip">Un toque = un producto. Ajusta las cantidades con los botones − y + del pedido.</div></section><section class="card order" id="current-order"><div class="order-header"><div><span class="eyebrow">LISTO PARA PREPARAR</span><h2>Tu pedido <span class="unit-pill">${units}</span></h2></div><button class="link" ${cart.length?'':'disabled'} onclick="clearOrderForm()">Vaciar</button></div><div class="service-label">1. ¿Dónde se sirve?</div><div class="switch"><button class="${orderType==='Mesa'?'active':''}" onclick="orderType='Mesa';render()">${icon('dashboard')} En mesa</button><button class="${orderType==='Para llevar'?'active':''}" onclick="orderType='Para llevar';render()">${icon('sale')} Para llevar</button></div>${orderType==='Mesa'?`<div class="table-chooser" aria-label="Seleccionar mesa">${Array.from({length:12},(_,i)=>`<button aria-label="Mesa ${i+1}" aria-pressed="${table==i+1}" class="${table==i+1?'active':''}" onclick="table='${i+1}';render()">${i+1}</button>`).join('')}</div>`:`<div class="takeaway-note">Pedido para recoger en mostrador</div>`}<div class="service-label">2. Revisa los productos</div><div class="order-items">${cart.length?cart.map(i=>`<div class="cartitem"><div class="cartitem-title"><b>${i.name}</b><span>${money(i.price*i.qty)}</span></div><div class="cartitem-controls"><span class="muted">${money(i.price)} c/u</span><div class="qty"><button aria-label="Quitar un ${i.name}" onclick="adjust(${i.id},-1)">−</button><b aria-label="Cantidad de ${i.name}">${i.qty}</b><button aria-label="Agregar un ${i.name}" onclick="adjust(${i.id},1)">+</button></div></div></div>`).join(''):`<div class="empty-order">${icon('ticket')}<b>Empieza con unos tacos</b><span>Toca los botones del menú.<br>Tu pedido aparecerá aquí.</span></div>`}</div><div class="order-bottom"><details class="order-notes" ${orderNote?'open':''}><summary>Agregar indicaciones al pedido</summary><label class="field"><span>Indicaciones (opcional)</span><input placeholder="Ej. sin cebolla, salsa aparte" value="${esc(orderNote)}" oninput="orderNote=this.value" maxlength="180"></label></details><div class="total"><div><span>Total a cobrar</span><small>${units} ${units===1?'producto':'productos'} · ${orderType==='Mesa'?'Mesa '+table:'Para llevar'}</small></div><b>${money(totalCart())}</b></div><button class="btn primary full pay-button" ${!cart.length||db.session.closed?'disabled':''} onclick="checkout()">Cobrar ${money(totalCart())} <span>→</span></button><p class="payment-note">Efectivo · Tarjeta · Transferencia</p></div></section></div><div class="mobile-orderbar"><button class="btn" onclick="document.getElementById('current-order').scrollIntoView({behavior:'smooth',block:'start'})">Ver pedido (${units})</button><button class="btn primary" ${!cart.length||db.session.closed?'disabled':''} onclick="checkout()">Cobrar ${money(totalCart())} →</button></div></div>`}
function productCards(ps){return ps.length?ps.map(p=>{let n=cart.find(i=>i.id===p.id)?.qty||0;return `<button class="product ${n?'in-order':''}" data-cat="${p.cat}" aria-label="Agregar ${p.name}, ${money(p.price)}" onclick="add(${p.id})"><div class="product-top"><span class="product-category">${p.cat}</span>${n?`<span class="product-count">${n} en pedido</span>`:''}</div><strong>${p.name}</strong><div class="price"><span>${money(p.price)}</span><span class="add-product">+ Agregar</span></div></button>`}).join(''):'<div class="empty">No encontramos ese producto.</div>'}
function updateProducts(){document.getElementById('products').innerHTML=productCards(menu.filter(p=>(category==='Todos'||p.cat===category)&&p.name.toLowerCase().includes(query.toLowerCase())))}
function add(id){let i=cart.find(i=>i.id===id);if(i)i.qty++;else cart.push({...menu.find(p=>p.id===id),qty:1});refreshOrder();announce(menu.find(p=>p.id===id).name+' agregado')}
function adjust(id,n){cart=cart.map(i=>i.id===id?{...i,qty:i.qty+n}:i).filter(i=>i.qty>0);refreshOrder()}
function refreshOrder(){let panel=document.querySelector('.menu-panel'),items=document.querySelector('.order-items'),scroll=panel?.scrollTop||0,itemScroll=items?.scrollTop||0,focused=document.activeElement?.getAttribute('aria-label');render();let p=document.querySelector('.menu-panel'),o=document.querySelector('.order-items');if(p)p.scrollTop=scroll;if(o)o.scrollTop=itemScroll;if(focused)Array.from(document.querySelectorAll('button[aria-label]')).find(b=>b.getAttribute('aria-label')===focused)?.focus({preventScroll:true})}
function announce(message){let el=document.getElementById('sale-announcement');if(el)el.textContent=message}
function clearOrderForm(){modal(modalhead('¿Vaciar este pedido?')+`<p style="margin:20px 0">Se quitarán los productos del pedido que estás preparando.</p><div class="quick"><button class="btn" onclick="closeModal()">Seguir con el pedido</button><button class="btn primary" onclick="cart=[];orderNote='';closeModal();render()">Sí, vaciar</button></div>`)}
function modal(html){document.getElementById('modal').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true">${html}</section></div>`;setTimeout(()=>document.querySelector('.modal input,.modal button')?.focus(),0)}function closeModal(){document.getElementById('modal').innerHTML=''}function modalhead(t){return `<div class="modalhead"><h2>${t}</h2><button class="close" aria-label="Cerrar" onclick="closeModal()">×</button></div>`}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

function payScreen(){modal(modalhead('Confirma el cobro')+`<p style="text-align:center;margin-top:18px;font-size:12px">${orderType==='Mesa'?'Mesa '+esc(table):'Para llevar'} · ${cart.reduce((n,i)=>n+i.qty,0)} productos</p><div class="bigmoney">${money(totalCart())}</div><div class="service-label">¿Cómo paga el cliente?</div><div class="paymethods">${['Efectivo','Tarjeta','Transferencia'].map(m=>`<button class="${payMethod===m?'active':''}" onclick="payMethod='${m}';payScreen()">${icon(m==='Efectivo'?'money':m==='Tarjeta'?'cash':'arrow')}<span>${m}</span></button>`).join('')}</div>${payMethod==='Efectivo'?`<label class="field received-field">Efectivo recibido<input id="received" type="number" inputmode="decimal" min="${totalCart()}" step="0.01" placeholder="0.00" oninput="updateChange()"></label><div class="quick-tender"><button onclick="setReceived(${totalCart()})">Importe exacto</button>${[100,200,500,1000].filter(n=>n>=totalCart()).slice(0,3).map(n=>`<button onclick="setReceived(${n})">${money(n).replace('.00','')}</button>`).join('')}</div><div class="cashrow change-row"><span>Cambio para el cliente</span><b id="change">${money(0)}</b></div>`:`<div class="info">${payMethod==='Tarjeta'?'Realiza el cobro en tu terminal.':'Verifica que la transferencia haya llegado.'} Confirma aquí cuando el pago esté recibido.</div>`}<div id="payerror" class="error" role="alert"></div><button class="btn primary full pay-button" style="margin-top:15px" onclick="completeSale()">Confirmar pago · ${money(totalCart())} <span>✓</span></button><p class="payment-note">Se guardará la venta y se generará el ticket.</p>`)}
function setReceived(amount){document.getElementById('received').value=amount.toFixed(2);updateChange()}
function updateChange(){let r=Number(document.getElementById('received').value);document.getElementById('change').textContent=money(Math.max(0,r-totalCart()));document.getElementById('payerror').textContent=''}
function completeSale(){if(!cart.length||db.session.closed)return;let received=payMethod==='Efectivo'?Number(document.getElementById('received').value):totalCart();if(!Number.isFinite(received)||received<totalCart()){document.getElementById('payerror').textContent='Ingresa un monto recibido igual o mayor al total.';return}let s={id:Math.max(0,...db.sales.map(s=>s.id))+1,date:new Date().toISOString(),items:cart.map(i=>({...i})),total:totalCart(),method:payMethod,type:orderType,table:orderType==='Mesa'?table:'',note:orderNote,session:db.session.id,received,change:payMethod==='Efectivo'?received-totalCart():0};db.sales.push(s);save();cart=[];orderNote='';render();receipt(s.id,true);toast('Venta registrada correctamente')}
function receipt(id,just=false){let s=db.sales.find(s=>s.id===id);modal(modalhead(just?'¡Pedido cobrado!':'Detalle del pedido')+`<div class="receipt">           LA TAQUERÍA\n       TICKET DE DEMOSTRACIÓN\n--------------------------------\nPedido #${String(s.id).padStart(4,'0')} · ${s.type==='Mesa'?'Mesa '+esc(s.table):'Para llevar'}\n${new Date(s.date).toLocaleString('es-MX',{timeZone:'America/Hermosillo'})}\n--------------------------------\n${s.items.map(i=>`${i.qty} × ${i.name}\n    ${money(i.price)} c/u     ${money(i.qty*i.price)}`).join('\n')}\n--------------------------------\nTOTAL: ${money(s.total)}\nPago: ${s.method}${s.method==='Efectivo'&&s.received?'\nRecibido: '+money(s.received)+'\nCambio: '+money(s.change):''}${s.note?'\nIndicaciones: '+esc(s.note):''}\n${s.cancelled?'\nVENTA CANCELADA\nMotivo: '+esc(s.cancelReason):''}\n         ¡Gracias por tu visita!</div><button class="btn primary full" onclick="window.print()">Imprimir ticket</button><p style="font-size:10px;margin-top:10px;text-align:center">Usa la impresión del navegador. Requiere configurar la impresora.</p>${!s.cancelled&&!db.session.closed&&s.session===db.session.id?`<button class="link" style="color:#b47964;margin-top:20px" onclick="cancelForm(${s.id})">Cancelar esta venta</button>`:''}`)}
function history(){let ss=[...db.sales].reverse().filter(s=>(historyMethod==='Todos'||s.method===historyMethod)&&('#'+String(s.id).padStart(4,'0')+' '+s.table+' '+s.type).toLowerCase().includes(historyQuery.toLowerCase()));return heading('Historial de ventas','Consulta cada pedido y sus detalles.',`<button class="btn" onclick="exportCSV()">${icon('export')} Exportar ventas</button>`)+`<div class="card"><div class="toolbar"><input class="search" style="max-width:350px" placeholder="Buscar por pedido o mesa…" aria-label="Buscar ventas" value="${esc(historyQuery)}" oninput="historyQuery=this.value;updateHistory()"><select class="search" style="max-width:190px" aria-label="Forma de pago" onchange="historyMethod=this.value;render()">${['Todos','Efectivo','Tarjeta','Transferencia'].map(m=>`<option ${historyMethod===m?'selected':''}>${m}</option>`).join('')}</select></div><p style="font-size:11px;margin-bottom:10px">Todos los periodos · Las ventas canceladas aparecen tachadas.</p><div class="tablewrap"><table><thead><tr><th>Pedido / hora</th><th>Servicio</th><th>Pago</th><th>Total</th><th>Detalle</th></tr></thead><tbody id="historyrows">${rows(ss)}</tbody></table></div></div>`}function updateHistory(){let ss=[...db.sales].reverse().filter(s=>(historyMethod==='Todos'||s.method===historyMethod)&&('#'+String(s.id).padStart(4,'0')+' '+s.table+' '+s.type).toLowerCase().includes(historyQuery.toLowerCase()));document.getElementById('historyrows').innerHTML=rows(ss)}
function cash(){let sales=currentSales(),ms=currentMoves(),cashTotal=sales.filter(s=>s.method==='Efectivo').reduce((a,s)=>a+s.total,0);return heading('Tu caja, en orden','Al cerrar el turno, cuenta el efectivo y compara.',`<span class="badge ${db.session.closed?'transferencia':''}">${db.session.closed?'Caja cerrada':'● Turno abierto'}</span>`)+`<div class="cashgrid"><section class="card"><div class="cardhead"><div><h2>Resumen del turno</h2><p>Abierto: ${new Date(db.session.opened).toLocaleString('es-MX',{timeZone:'America/Hermosillo'})}</p></div></div><div class="cashrow"><span>Fondo inicial</span><b>${money(db.session.fund)}</b></div><div class="cashrow"><span>+ Ventas en efectivo</span><b>${money(cashTotal)}</b></div><div class="cashrow"><span>+ Entradas de efectivo</span><b>${money(ms.filter(m=>m.type==='Entrada').reduce((a,m)=>a+m.amount,0))}</b></div><div class="cashrow"><span>− Salidas de efectivo</span><b>${money(ms.filter(m=>m.type==='Salida').reduce((a,m)=>a+m.amount,0))}</b></div><div class="cashrow big"><span>Efectivo esperado</span><b>${money(expected())}</b></div><div class="info">Cuenta únicamente billetes y monedas. Los pagos con tarjeta y transferencia se muestran por separado.</div><div class="quick" style="margin-top:20px">${db.session.closed?`<button class="btn primary full" onclick="openForm()">Abrir nuevo turno</button>`:`<button class="btn" onclick="moveForm()">${icon('plus')} Entrada / salida</button><button class="btn primary" onclick="closeForm()">Hacer corte de caja →</button>`}</div></section><div><section class="card"><h2>Ventas por forma de pago</h2>${['Efectivo','Tarjeta','Transferencia'].map(m=>`<div class="cashrow"><span>${m}</span><b>${money(sales.filter(s=>s.method===m).reduce((a,s)=>a+s.total,0))}</b></div>`).join('')}<div class="cashrow" style="font-weight:650;border:0"><span>Total vendido · ${sales.length} pedidos</span><b>${money(sales.reduce((a,s)=>a+s.total,0))}</b></div></section><section class="card" style="margin-top:20px"><h2>Movimientos de efectivo</h2>${ms.length?ms.map(m=>`<div class="cashrow"><div>${esc(m.reason)}<div class="sub" style="margin-top:5px">${m.type} · ${time(m.date)}</div></div><b>${m.type==='Entrada'?'+':'−'}${money(m.amount)}</b></div>`).join(''):'<div class="empty">Sin entradas ni salidas adicionales.</div>'}</section></div></div><section class="card" style="margin-top:22px"><h2>Cortes anteriores</h2><div class="tablewrap"><table><thead><tr><th>Cierre</th><th>Esperado</th><th>Contado</th><th>Diferencia</th></tr></thead><tbody>${db.cuts.length?[...db.cuts].reverse().map(c=>`<tr><td>${new Date(c.date).toLocaleString('es-MX',{timeZone:'America/Hermosillo'})}</td><td>${money(c.expected)}</td><td>${money(c.counted)}</td><td style="color:${c.diff===0?'#39714f':'#b47544'}">${c.diff===0?'Cuadrado':(c.diff>0?'Sobrante: ':'Faltante: ')+money(Math.abs(c.diff))}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">Tu primer corte aparecerá aquí.</td></tr>'}</tbody></table></div></section>`}
function moveForm(){modal(modalhead('Movimiento de efectivo')+`<p>Registra dinero que entra o sale de la caja.</p><label class="field">Tipo de movimiento<select id="movetype"><option>Salida</option><option>Entrada</option></select></label><label class="field">Importe<input id="moveamount" type="number" min="0.01" step="0.01" placeholder="0.00"></label><label class="field">Motivo<input id="movereason" maxlength="100" placeholder="Ej. compra de hielo"></label><div id="formerror" class="error" role="alert"></div><button class="btn primary full" onclick="saveMove()">Registrar movimiento</button>`)}function saveMove(){let amount=Number(document.getElementById('moveamount').value),reason=document.getElementById('movereason').value.trim(),type=document.getElementById('movetype').value;if(!Number.isFinite(amount)||amount<=0||!reason){document.getElementById('formerror').textContent='Ingresa un importe mayor a cero y el motivo.';return}if(type==='Salida'&&amount>expected()){document.getElementById('formerror').textContent='La salida supera el efectivo esperado en caja.';return}db.moves.push({amount,reason,type,date:new Date().toISOString(),session:db.session.id});save();closeModal();render();toast('Movimiento registrado')}
function closeForm(){modal(modalhead('Cierre de turno')+`<p>Cuenta el efectivo físico antes de cerrar.</p><div class="cashrow"><span>Efectivo esperado</span><b>${money(expected())}</b></div><label class="field">¿Cuánto efectivo contaste?<input id="counted" type="number" min="0" step="0.01" placeholder="0.00" oninput="calcDiff()"></label><div id="diff" class="info">Ingresa el efectivo contado para comparar.</div><div id="formerror" class="error" role="alert"></div><button class="btn primary full" style="margin-top:20px" onclick="saveCut()">Confirmar corte y cerrar turno</button>`)}function calcDiff(){let raw=document.getElementById('counted').value,d=Number(raw)-expected();document.getElementById('diff').textContent=raw===''?'Ingresa el efectivo contado para comparar.':d===0?'✓ Tu caja está cuadrada.':(d>0?'Sobrante de efectivo: ':'Faltante de efectivo: ')+money(Math.abs(d))}function saveCut(){let raw=document.getElementById('counted').value,n=Number(raw);if(raw===''||!Number.isFinite(n)||n<0){document.getElementById('formerror').textContent='Ingresa un importe válido, incluyendo cero si corresponde.';return}db.cuts.push({date:new Date().toISOString(),expected:expected(),counted:n,diff:Math.round((n-expected())*100)/100,session:db.session.id});db.session.closed=true;save();closeModal();render();toast('Corte guardado. Turno cerrado.')}
function openForm(){modal(modalhead('Abrir nuevo turno')+`<p>Registra el efectivo que dejas para dar cambio.</p><label class="field">Fondo inicial<input id="fund" type="number" min="0" step="0.01" value="500"></label><div id="formerror" class="error" role="alert"></div><button class="btn primary full" onclick="openSession()">Abrir caja</button>`)}function openSession(){let raw=document.getElementById('fund').value,n=Number(raw);if(raw===''||!Number.isFinite(n)||n<0){document.getElementById('formerror').textContent='Ingresa un fondo válido.';return}db.session={id:'turn-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10),opened:new Date().toISOString(),fund:n,closed:false};save();closeModal();render();toast('Nuevo turno abierto')}
function cancelForm(id){modal(modalhead('Cancelar venta #'+String(id).padStart(4,'0'))+`<p>La venta quedará en el historial como cancelada y se descontará del resumen. Si fue en efectivo, devuelve el dinero al cliente.</p><label class="field">Motivo de cancelación<input id="cancelreason" maxlength="150" placeholder="Escribe el motivo"></label><div id="formerror" class="error" role="alert"></div><button class="btn full" style="color:#a64e36" onclick="cancelSale(${id})">Confirmar cancelación</button>`)}function cancelSale(id){let reason=document.getElementById('cancelreason').value.trim();if(!reason){document.getElementById('formerror').textContent='Escribe el motivo de la cancelación.';return}let s=db.sales.find(s=>s.id===id);if(s.session!==db.session.id||db.session.closed||s.cancelled)return;s.cancelled=true;s.cancelReason=reason;save();closeModal();render();toast('Venta cancelada. Totales actualizados.')}
function exportCSV(){const cell=s=>'"'+String(s).replace(/"/g,'""').replace(/^[=+@-]/,"'")+'"';let data=[['Pedido','Fecha','Servicio','Mesa','Forma de pago','Total MXN','Estado'],...db.sales.map(s=>[s.id,new Date(s.date).toLocaleString('es-MX',{timeZone:'America/Hermosillo'}),s.type,s.table,s.method,s.total,s.cancelled?'Cancelada':'Pagada'])].map(r=>r.map(cell).join(',')).join('\r\n');let url=URL.createObjectURL(new Blob(['\uFEFF'+data],{type:'text/csv;charset=utf-8;'})),a=document.createElement('a');a.href=url;a.download='ventas-taqueria.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Ventas exportadas')}
render();save();
</script></body></html>
